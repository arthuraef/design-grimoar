services:
  # --------------------------------------------------------------------------
  # 1. BANCO VETORIAL & RELACIONAL: PostgreSQL 16 + pgvector (OCI ARM64 Enxuto)
  # --------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: grimoar-pgvector
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=25 -c maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-design_grimoar}
      POSTGRES_USER: ${POSTGRES_USER:-grimoar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variavel obrigatoria POSTGRES_PASSWORD no .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Bind estrito em loopback para proibir exposição na internet (contornando ufw da OCI)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grimoar} -d ${POSTGRES_DB:-design_grimoar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - grimoar_net

  # --------------------------------------------------------------------------
  # 2. INGESTÃO WEB & FILA: Redis 7 Alpine
  # --------------------------------------------------------------------------
  firecrawl-redis:
    image: redis:7-alpine
    container_name: grimoar-firecrawl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - firecrawl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - grimoar_net

  # Serviço opcional caso o operador queira rodar o motor Firecrawl self-hosted
  firecrawl-engine:
    image: mendableai/firecrawl:latest
    container_name: grimoar-firecrawl-engine
    restart: unless-stopped
    profiles:
      - self-hosted
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      REDIS_URL: redis://firecrawl-redis:6379
      USE_FIRE_ENGINE: "false"
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      NUM_WORKERS_PER_QUEUE: 2
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - grimoar_net

  # --------------------------------------------------------------------------
  # 3. NOTIFICAÇÕES & CRON: Hermes Agent (Nous Research Pattern)
  # --------------------------------------------------------------------------
  hermes-agent:
    build:
      context: ./infra/hermes
      dockerfile: Dockerfile
    container_name: grimoar-hermes-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grimoar}:${POSTGRES_PASSWORD:?Variavel obrigatoria POSTGRES_PASSWORD no .env}@pgvector:5432/${POSTGRES_DB:-design_grimoar}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      CRON_SCHEDULE: ${HERMES_CRON_SCHEDULE:-0 3 * * *}
      HERMES_PORT: 5055
      TZ: America/Sao_Paulo
    ports:
      # Bind estrito em loopback para proibir exposição pública
      - "127.0.0.1:5055:5055"
    volumes:
      - ./logs:/app/logs
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - grimoar_net

  # --------------------------------------------------------------------------
  # 4. ORQUESTRADOR MULTIAGENTE: DeepSeek Harness (Cordis Framework)
  # --------------------------------------------------------------------------
  deepseek-harness:
    build:
      context: .
      dockerfile: infra/dsh/Dockerfile
    container_name: grimoar-dsh-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      DATABASE_URL: postgresql://${POSTGRES_USER:-grimoar}:${POSTGRES_PASSWORD:?Variavel obrigatoria POSTGRES_PASSWORD no .env}@pgvector:5432/${POSTGRES_DB:-design_grimoar}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?Variavel obrigatoria FIRECRAWL_API_KEY no .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Variavel obrigatoria GITHUB_TOKEN no .env}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_REPO: ${GITHUB_REPO:-arthuraef/design-grimoar}
      STATIC_SITE_CONTENT_DIR: /app/docs/src/content/docs
      HERMES_AGENT_API_URL: http://hermes-agent:5055/webhook/step-completed
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.82}
      LEXICOGRAPHER_API_KEY: ${LEXICOGRAPHER_API_KEY:-}
      LEXICOGRAPHER_BASE_URL: ${LEXICOGRAPHER_BASE_URL:-}
      LEXICOGRAPHER_MODEL: ${LEXICOGRAPHER_MODEL:-}
      ACADEMIC_AUDITOR_API_KEY: ${ACADEMIC_AUDITOR_API_KEY:-}
      ACADEMIC_AUDITOR_BASE_URL: ${ACADEMIC_AUDITOR_BASE_URL:-}
      ACADEMIC_AUDITOR_MODEL: ${ACADEMIC_AUDITOR_MODEL:-}
      VERIFICATION_LOOP_MAX_ATTEMPTS: ${VERIFICATION_LOOP_MAX_ATTEMPTS:-3}
      STEALTH_MODE: ${STEALTH_MODE:-true}
      STEALTH_MIN_MINUTES: ${STEALTH_MIN_MINUTES:-15}
      STEALTH_MAX_MINUTES: ${STEALTH_MAX_MINUTES:-40}
      MAX_VERBETES_PER_HOUR: ${MAX_VERBETES_PER_HOUR:-3}
    volumes:
      - ./taxonomia:/app/taxonomia
      - ./docs/src/content/docs:/app/docs/src/content/docs
      - ./.git:/app/.git
      - ./logs:/app/logs
    depends_on:
      pgvector:
        condition: service_healthy
      hermes-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - grimoar_net

networks:
  grimoar_net:
    name: designgrimoar_net
    driver: bridge

volumes:
  pgvector_data:
    name: designgrimoar_pgvector_data
    driver: local
  firecrawl_redis_data:
    name: designgrimoar_firecrawl_redis_data
    driver: local
