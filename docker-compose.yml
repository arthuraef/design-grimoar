services:
  # --------------------------------------------------------------------------
  # 1. BANCO VETORIAL & RELACIONAL: PostgreSQL 16 + pgvector (ARM64 Native)
  # --------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: grimoar-pgvector
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-design_grimoar}
      POSTGRES_USER: ${POSTGRES_USER:-grimoar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grimoar_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grimoar} -d ${POSTGRES_DB:-design_grimoar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  # --------------------------------------------------------------------------
  # 2. INGESTÃO WEB DETERMINÍSTICA: Firecrawl Engine (Redis + API)
  # --------------------------------------------------------------------------
  firecrawl-redis:
    image: redis:7-alpine
    container_name: grimoar-firecrawl-redis
    platform: linux/arm64
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - firecrawl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  firecrawl-engine:
    image: mendableai/firecrawl:latest
    container_name: grimoar-firecrawl-engine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      REDIS_URL: redis://firecrawl-redis:6379
      USE_FIRE_ENGINE: "false"
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      NUM_WORKERS_PER_QUEUE: 2
    ports:
      - "3002:3002"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

  # --------------------------------------------------------------------------
  # 3. NOTIFICAÇÕES & CRON: Hermes Agent (Nous Research)
  # --------------------------------------------------------------------------
  hermes-agent:
    build:
      context: ./infra/hermes
      dockerfile: Dockerfile
    container_name: grimoar-hermes-agent
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grimoar}:${POSTGRES_PASSWORD:-grimoar_secure_pass}@pgvector:5432/${POSTGRES_DB:-design_grimoar}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      CRON_SCHEDULE: ${HERMES_CRON_SCHEDULE:-0 3 * * *}
      HERMES_PORT: 5055
      TZ: America/Sao_Paulo
    ports:
      - "5055:5055"
    volumes:
      - ./logs/hermes:/app/logs
    depends_on:
      pgvector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  # --------------------------------------------------------------------------
  # 4. ORQUESTRADOR DE AGENTES: DeepSeek Harness (dsh / Cordis Framework)
  # --------------------------------------------------------------------------
  deepseek-harness:
    build:
      context: .
      dockerfile: infra/dsh/Dockerfile
    container_name: grimoar-dsh-orchestrator
    platform: linux/arm64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-grimoar}:${POSTGRES_PASSWORD:-grimoar_secure_pass}@pgvector:5432/${POSTGRES_DB:-design_grimoar}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-http://firecrawl-engine:3002}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./taxonomia:/app/taxonomia
      - ./docs:/app/docs
      - ./prompts:/app/prompts:ro
      - ./dsh.config.yml:/app/dsh.config.yml:ro
      - ./logs/dsh:/app/logs
    depends_on:
      pgvector:
        condition: service_healthy
      firecrawl-engine:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6144M

volumes:
  pgvector_data:
    driver: local
  firecrawl_redis_data:
    driver: local
