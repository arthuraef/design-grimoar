name: Deploy Front-end to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, enfileirando execuções
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site (Notion-like)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Instalar Dependências do Front-end
        run: |
          cd docs && npm ci

      - name: Compilar Site Estático com Astro
        run: |
          cd docs && npm run build

      - name: Upload do Artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
